version: '3.8'

services:
  # Redis for pub/sub messaging
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # LiveKit Server (WebRTC SFU)
  livekit-server:
    image: livekit/livekit-server:v1.5.2
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"   # HTTP/WebSocket signaling
      - "50000-50100:50000-50100/udp"  # RTC port range for media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - default

  # Analysis Worker (Python: OpenAI Vision API - no GPU needed!)
  # Fast camera analysis using GPT-4 Vision (works on any Mac/Linux!)
  analysis-worker:
    build:
      context: ./workers/analysis-worker
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # OpenAI API config (required for camera analysis)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - FRAME_SAMPLE_INTERVAL=${FRAME_SAMPLE_INTERVAL}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./workers/analysis-worker:/app
      - model-cache:/root/.cache
    depends_on:
      - redis
      - livekit-server
    restart: unless-stopped

  # Decision Service (Node.js/TypeScript)
  decision-service:
    build:
      context: .
      dockerfile: services/decision-service/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - MIN_HOLD_SEC=2.0
      - COOLDOWN_SEC=4.0
      - DELTA_S_THRESHOLD=0.15
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - redis

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - PORT=3000
      - USE_HTTPS=false
      - KEY_PATH=/app/certs/192.168.68.54+localhost-key.pem
    ports:
      - "3000:3000"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - redis
      - decision-service

  # Web OBS UI (Next.js)
  web-obs:
    build:
      context: .
      dockerfile: web-obs/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
    ports:
      - "3101:3000"
    depends_on:
      - api-gateway

volumes:
  redis-data:
  model-cache:
