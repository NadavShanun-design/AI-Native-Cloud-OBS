port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  tcp_port: 7881
  # Enable loopback for local Mac development
  enable_loopback_candidate: true
  # STUN servers for clients (helps with mDNS on Mac)
  stun_servers:
    - stun.l.google.com:19302

keys:
  devkey: "secretsecretsecretsecretsecretsecret"

logging:
  level: debug
  sample: false

redis:
  address: redis:6379

room:
  auto_create: true
  empty_timeout: 300
