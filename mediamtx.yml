###############################################
# MediaMTX Configuration
# Camera Streaming Server for Cloud Observability System
###############################################

# Logging
logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

###############################################
# Authentication
###############################################

authMethod: internal

authInternalUsers:
  # Allow all users to read and publish
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

  # Allow localhost to access API
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics

###############################################
# API Server
###############################################

api: yes
apiAddress: :9997

###############################################
# RTSP Server
###############################################

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"

###############################################
# RTMP Server
###############################################

rtmp: yes
rtmpAddress: :1935

###############################################
# HLS Server (HTTP Live Streaming - Browser Fallback)
###############################################

hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: '*'
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsMuxerCloseAfter: 60s

###############################################
# WebRTC Server (Primary Browser Streaming)
###############################################

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes

###############################################
# SRT Server
###############################################

srt: yes
srtAddress: :8890

###############################################
# Path Defaults
###############################################

pathDefaults:
  source: publisher

  # On-demand streaming is configured per-path below
  # (only for paths with RTSP sources)
  sourceOnDemand: no
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s

  # No reader limit
  maxReaders: 0

  # Recording disabled by default
  record: no
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 1h

###############################################
# Camera Paths (6 Reolink RLC-820A Cameras)
