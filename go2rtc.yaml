# go2rtc configuration for Reolink RLC-820A cameras
# RLC-820A specific: Main stream is H.265, sub stream is H.264
# RTSP URL format: rtsp://user:pass@ip:554/h264Preview_01_sub (SINGLE slash!)
# Tested format from RLC-820A users: /h264Preview_01_sub for sub, /h264Preview_01_main for main

streams:
  # Camera 1 - 10.39.12.110
  camera_1:
    - rtsp://admin:Password03!@10.39.12.110:554/h264Preview_01_sub

  camera_1_hd:
    - rtsp://admin:Password03!@10.39.12.110:554/h264Preview_01_main

  # Camera 2 - 10.39.12.107
  camera_2:
    - rtsp://admin:Password03!@10.39.12.107:554/h264Preview_01_sub

  camera_2_hd:
    - rtsp://admin:Password03!@10.39.12.107:554/h264Preview_01_main

  # Camera 3 - 10.39.12.104
  camera_3:
    - rtsp://admin:Password03!@10.39.12.104:554/h264Preview_01_sub

  camera_3_hd:
    - rtsp://admin:Password03!@10.39.12.104:554/h264Preview_01_main

  # Camera 4 - 10.39.12.106
  camera_4:
    - rtsp://admin:Password03!@10.39.12.106:554/h264Preview_01_sub

  camera_4_hd:
    - rtsp://admin:Password03!@10.39.12.106:554/h264Preview_01_main

  # Camera 5 - 10.39.12.109
  camera_5:
    - rtsp://admin:Password03!@10.39.12.109:554/h264Preview_01_sub

  camera_5_hd:
    - rtsp://admin:Password03!@10.39.12.109:554/h264Preview_01_main

  # Camera 6 - 10.39.12.108
  camera_6:
    - rtsp://admin:Password03!@10.39.12.108:554/h264Preview_01_sub

  camera_6_hd:
    - rtsp://admin:Password03!@10.39.12.108:554/h264Preview_01_main

# WebRTC configuration
webrtc:
  listen: ":8555"

# API configuration
api:
  listen: ":1984"
  origin: "*"

# Logging
log:
  level: debug
