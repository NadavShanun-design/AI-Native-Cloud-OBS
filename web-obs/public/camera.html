<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* mirror like selfie */
    }
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      backdrop-filter: blur(10px);
      max-width: 90%;
      text-align: center;
    }
    #camId {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #10b981;
      padding: 16px 32px;
      border-radius: 24px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    .connected { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Loading...</div>
  <div id="camId"></div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const cameraId = urlParams.get('id') || 'cam-' + Math.floor(Math.random() * 5 + 1);
    // Always use the API Gateway URL (port 3000), not the current page origin
    // Use current page origin so it works both locally and through ngrok
    const apiUrl = window.location.origin;

    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const camIdEl = document.getElementById('camId');

    camIdEl.textContent = cameraId.toUpperCase();

    let room = null;

    async function start() {
      try {
        // Check if getUserMedia is available
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera API not available. Please use HTTPS or localhost in a modern browser.');
        }

        console.log('✅ navigator.mediaDevices available');
        console.log('✅ LiveKit client loaded:', typeof LivekitClient !== 'undefined');

        // 1. Get camera FIRST (instant preview)
        status.textContent = 'Requesting camera access...';
        console.log('🎥 Requesting camera access...');

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'user'
          },
          audio: true
        });

        console.log('✅ Camera access granted');

        // Show local preview immediately
        video.srcObject = stream;
        status.textContent = 'Camera ready, connecting to LiveKit...';

        // 2. Get LiveKit token
        console.log('🔑 Fetching LiveKit token...');
        const tokenRes = await fetch(`${apiUrl}/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identity: cameraId,
            room: 'main',
            role: 'camera'
          })
        });

        const tokenData = await tokenRes.json();
        if (!tokenData.success) {
          throw new Error('Failed to get token: ' + JSON.stringify(tokenData));
        }

        const { token, url } = tokenData.data;
        console.log('✅ Token received, LiveKit URL:', url);

        // 3. Connect to LiveKit
        status.textContent = 'Connecting to LiveKit...';
        console.log('🔌 Connecting to LiveKit:', url);

        room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true
        });

        await room.connect(url, token);
        console.log('✅ Connected to LiveKit room');

        // 4. Publish our camera feed
        status.textContent = 'Publishing video feed...';
        console.log('📡 Publishing tracks...');

        // Get tracks from our stream
        const videoTrack = stream.getVideoTracks()[0];
        const audioTrack = stream.getAudioTracks()[0];

        // Publish to LiveKit
        await room.localParticipant.publishTrack(videoTrack, {
          videoEncoding: {
            maxBitrate: 2_500_000,
            maxFramerate: 30,
          },
          simulcast: true,
        });

        await room.localParticipant.publishTrack(audioTrack);

        console.log('✅ Tracks published successfully');

        // Done!
        status.textContent = '🔴 LIVE';
        status.className = 'connected';

        console.log('✅ Broadcasting as', cameraId);

      } catch (error) {
        console.error('❌ Error:', error);
        status.textContent = `Error: ${error.message}`;
        status.className = 'error';

        // Show detailed debug info
        console.log('🐛 Debug info:');
        console.log('  - navigator.mediaDevices:', typeof navigator.mediaDevices);
        console.log('  - getUserMedia:', typeof navigator.mediaDevices?.getUserMedia);
        console.log('  - LivekitClient:', typeof LivekitClient);
        console.log('  - URL:', window.location.href);
        console.log('  - Protocol:', window.location.protocol);
      }
    }

    // AUTO-START when page loads
    console.log('🚀 Camera page loaded');
    console.log('  - Camera ID:', cameraId);
    console.log('  - API URL:', apiUrl);
    console.log('  - Page URL:', window.location.href);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }

    // Keep screen awake
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {
        console.log('⚠️ Wake lock not available');
      });
    }
  </script>
</body>
</html>
